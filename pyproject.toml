[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "material-scheduling-agent"
version = "0.3.0"
description = "Bounded offline scheduling Agent with transactional tools and replayable traces"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["material_scheduler*"]

[tool.setuptools]
package-dir = {"" = "src"}
