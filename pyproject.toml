[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "material-scheduling-agent"
version = "0.1.0"
description = "Evidence-based material review and scheduling drafts; M1 domain foundation"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["material_scheduler*"]

[tool.setuptools]
package-dir = {"" = "src"}
